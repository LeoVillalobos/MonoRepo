###############################################################
# Archivo de configuración principal de NGINX
# Documentado para mayor claridad
###############################################################

# Usuario bajo el cual se ejecuta el proceso principal de NGINX
user  nginx;

# Número de procesos de trabajo, 'auto' usa el número de núcleos disponibles
worker_processes  auto;

# Ruta y nivel de log para errores
error_log  /var/log/nginx/error.log warn;
# Archivo donde se almacena el PID del proceso principal
pid        /var/run/nginx.pid;

# Bloque de configuración de eventos
events {
    # Número máximo de conexiones simultáneas por proceso de trabajo
    worker_connections 1024;
}

# Bloque de configuración HTTP
http {
    # Incluye los tipos MIME para archivos servidos
    include       /etc/nginx/mime.types;
    # Tipo por defecto para archivos desconocidos
    default_type  application/octet-stream;

    # Permite el uso de sendfile para mejorar el rendimiento de archivos estáticos
    sendfile        on;
    # Tiempo de espera para conexiones keep-alive
    keepalive_timeout  65;

    # Incluye todos los archivos de configuración de servidores virtuales
    # ubicados en el directorio conf.d/
    include /etc/nginx/conf.d/*.conf;
}
